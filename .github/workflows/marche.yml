name: Cours du S&P 500

on:
  schedule:
    - cron: '30 22 * * 1-5'   # chaque soir de bourse, après la clôture de New York
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/marche.mjs
      - name: Enregistrer marche.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add marche.json
          git diff --cached --quiet || (git commit -m "Cours du S&P 500" && git push)
