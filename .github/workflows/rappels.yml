name: Rappels

on:
  schedule:
    - cron: '5 * * * *'   # chaque heure (résumé du matin + rappels 1 h avant)
  workflow_dispatch:
    inputs:
      test:
        description: 'Envoyer une notification de test à tous les appareils'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rappels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock --no-audit --no-fund web-push@3.6.7
      - run: node scripts/rappels.mjs
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST: ${{ inputs.test }}
