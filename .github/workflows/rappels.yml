name: Rappels

on:
  schedule:
    - cron: '5 * * * *'     # chaque heure (résumé du matin, veille au soir, rappels 1 h avant)
    - cron: '30 4,5 * * *'  # 6 h 30 à Paris (été / hiver) : résumé avancé si rendez-vous avant 9 h
  workflow_dispatch:
    inputs:
      test:
        description: 'Envoyer une notification de test à tous les appareils'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rappels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --no-audit --no-fund web-push@3.6.7
      - run: node scripts/rappels.mjs
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST: ${{ inputs.test }}
          SCHEDULE: ${{ github.event.schedule }}
