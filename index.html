<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon agenda perso</title>
<meta name="theme-color" content="#0e6b6b">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head><body>
<div id="sy"></div><main id="app"></main>
<button class="fab" id="fab" aria-label="Ajouter">+</button>
<nav id="nav"></nav>
<aside id="np" aria-label="Bloc-notes"><h2>Bloc-notes</h2><textarea class="np-ta" placeholder="Tes notes, listes, idées…" oninput="noteIn(this.value)"></textarea><small class="np-st">Enregistré automatiquement</small></aside>
<button class="npb" type="button" aria-label="Ouvrir le bloc-notes" onclick="noteF()">📝</button>
<aside id="pl" aria-label="Mon budget"></aside>
<button class="plb" type="button" aria-label="Ouvrir mon budget" onclick="planF()">💰</button>
<button class="adb" type="button" aria-label="Mes adresses" onclick="adrF()">📍</button>
<div id="m" role="dialog" aria-modal="true"><div class="sheet"><button class="mx" type="button" aria-label="Fermer" onclick="closeF()">✕</button><div id="sh"></div></div></div>
<script src="assets/js/app.js"></script>
<script src="assets/js/sync.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body></html>
